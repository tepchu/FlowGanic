services:
  core-service:
    build: ./core-service
    restart: unless-stopped
    environment:
      DB_PATH: /data/flowganic.db
      API_KEY: ${API_KEY:-}
    volumes:
      - flowganic-data:/data
    mem_limit: 256m
    cpus: 0.5
    networks:
      - internal

  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      - core-service
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 64m
    cpus: 0.25
    networks:
      - internal

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: [public]
    depends_on:
      - gateway
    command: tunnel run --token ${TUNNEL_TOKEN:-}
    mem_limit: 128m
    cpus: 0.25
    networks:
      - internal

networks:
  internal:

volumes:
  flowganic-data:

