limit_req_zone $binary_remote_addr zone=api:1m rate=5r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 1m;

    # --- Dokumentasi interaktif -------------------------------------------
    location = /docs            { return 301 /api/docs/; }
    location = /api/docs        { return 301 /api/docs/; }

    location /api/docs/ {
        alias /usr/share/nginx/html/docs/;
        index index.html;
    }

    location = /api/openapi.yaml {
        alias /etc/nginx/openapi.yaml;
        default_type application/yaml;
    }

    location = /openapi.yaml {
        alias /etc/nginx/openapi.yaml;
        default_type application/yaml;
    }

    # --- Microservice ------------------------------------------------------
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://core-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # --- Sisanya diteruskan ke aaPanel di host ------------------------------
    # Panel memuat aset dari path root, jadi yang diteruskan bukan hanya
    # /aapanel melainkan seluruh path di luar /api.
    location / {
        proxy_pass https://host.docker.internal:1122;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
