openapi: 3.0.3
info:
  title: FlowGanic API
  version: 1.0.0
  description: >
    Koordinasi distribusi sampah Kota Bandung. Menghubungkan penghasil sampah
    dengan pengolah melalui permintaan penjemputan yang terlacak, serta
    menyediakan rekap agregat dan anonim bagi koordinator wilayah dan DLH.
    Data pada layanan ini masih data contoh untuk wilayah pilot.
servers:
  - url: https://kononkatanya.stei.fun/api
    description: Produksi, STB via Cloudflare Tunnel
  - url: /api
    description: Relatif terhadap host, untuk uji lokal
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Permintaan:
      type: object
      properties:
        id: {type: string, example: 9f2c1ab40e73}
        penghasil_ref: {type: string, example: rt03-rumah-12}
        wilayah_id: {type: string, example: rw05-lebak-siliwangi}
        jenis: {type: string, enum: [ORGANIK, ANORGANIK, RESIDU]}
        perkiraan_kg: {type: integer, example: 20}
        jadwal: {type: string, format: date, example: '2026-11-25'}
        status:
          type: string
          enum: [diajukan, dijadwalkan, ditolak, selesai]
          description: >
            diajukan: belum ada pengolah yang sanggup pada tanggal itu.
            dijadwalkan: sudah dicocokkan. ditolak: tidak ada pengolah yang
            dapat melayani. selesai: volume dikonfirmasi pengolah.
        pengolah_id: {type: string, nullable: true, example: bsf-lebak}
        volume_kg: {type: integer, nullable: true, example: 23}
        dibuat_pada: {type: string, format: date-time}
        diperbarui_pada: {type: string, format: date-time}
    Galat:
      type: object
      properties:
        galat: {type: string}
security:
  - ApiKeyAuth: []
paths:
  /health:
    get:
      summary: Cek layanan
      security: []
      responses:
        '200': {description: Layanan aktif}
  /wilayah:
    get:
      summary: Daftar wilayah layanan
      description: "Wilayah pilot ditandai `pilot: true`."
      responses:
        '200': {description: Daftar wilayah beserta kecamatan dan penanda pilot}
        '401': {description: API key tidak valid atau belum disertakan}
  /pengolah:
    get:
      summary: Daftar pengolah aktif
      description: Memuat kapasitas harian, wilayah yang dilayani, dan jenis sampah yang diterima.
      parameters:
        - in: query
          name: wilayah_id
          schema: {type: string}
          example: rw05-lebak-siliwangi
        - in: query
          name: jenis
          schema: {type: string, enum: [ORGANIK, ANORGANIK, RESIDU]}
      responses:
        '200': {description: Daftar pengolah yang cocok dengan saringan}
        '400': {description: Jenis sampah tidak dikenal}
        '401': {description: API key tidak valid atau belum disertakan}
  /permintaan:
    post:
      summary: Ajukan penjemputan sampah
      description: >
        Sistem mencocokkan permintaan dengan pengolah yang melayani wilayah dan
        jenis tersebut dan masih memiliki sisa kapasitas pada tanggal itu.
        Pengajuan ulang dengan penghasil, wilayah, jenis, dan jadwal yang sama
        tidak menggandakan permintaan: permintaan yang sudah ada dikembalikan
        dengan `duplikat: true` dan status 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [penghasil_ref, wilayah_id, jenis, perkiraan_kg, jadwal]
              properties:
                penghasil_ref:
                  type: string
                  description: Kode anonim penghasil, bukan nama atau alamat.
                  pattern: '^[a-z0-9-]{3,40}$'
                  example: rt03-rumah-12
                wilayah_id: {type: string, example: rw05-lebak-siliwangi}
                jenis: {type: string, enum: [ORGANIK, ANORGANIK, RESIDU]}
                perkiraan_kg: {type: integer, minimum: 1, maximum: 1000, example: 20}
                jadwal: {type: string, format: date, example: '2026-11-25'}
      responses:
        '201':
          description: Permintaan baru dibuat
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Permintaan'}
        '200': {description: Permintaan identik sudah ada, dikembalikan apa adanya}
        '400': {description: Masukan tidak valid}
        '401': {description: API key tidak valid atau belum disertakan}
        '404': {description: Wilayah tidak ditemukan}
  /permintaan/{id}:
    get:
      summary: Lacak satu permintaan
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Status terkini permintaan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Permintaan'}
        '401': {description: API key tidak valid atau belum disertakan}
        '404': {description: Permintaan tidak ditemukan}
    patch:
      summary: Perbarui permintaan dari sisi pengolah
      description: >
        `terima` menegaskan penjadwalan. `tolak` mencari pengolah lain lebih
        dahulu; bila tidak ada, permintaan berstatus ditolak. `selesai`
        mengonfirmasi volume sebenarnya yang masuk ke fasilitas. Pemilik
        permintaan tidak pernah berubah.
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [aksi]
              properties:
                aksi: {type: string, enum: [terima, tolak, selesai]}
                volume_kg:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  description: Wajib bila aksi bernilai selesai.
            example: {aksi: selesai, volume_kg: 23}
      responses:
        '200':
          description: Permintaan setelah diperbarui
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Permintaan'}
        '400': {description: Aksi tidak dikenal, volume tidak sah, atau permintaan sudah final}
        '401': {description: API key tidak valid atau belum disertakan}
        '404': {description: Permintaan tidak ditemukan}
  /rekap:
    get:
      summary: Rekap agregat sampah terkelola
      description: >
        Hanya memuat hitungan dan volume. Tidak pernah memuat kode penghasil,
        alamat, maupun id permintaan, sesuai batasan berbagi data pada Tugas 1.
        Inilah endpoint yang dibuka untuk kelompok mitra.
      parameters:
        - in: query
          name: wilayah_id
          schema: {type: string}
        - in: query
          name: jenis
          schema: {type: string, enum: [ORGANIK, ANORGANIK, RESIDU]}
        - in: query
          name: dari
          schema: {type: string, format: date}
        - in: query
          name: sampai
          schema: {type: string, format: date}
      responses:
        '200': {description: Total dan rincian per jenis sampah}
        '400': {description: Saringan tidak valid}
        '401': {description: API key tidak valid atau belum disertakan}
